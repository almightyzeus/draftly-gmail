<mat-toolbar color="primary" class="sticky top-0 z-10 gap-1 shadow-[0_2px_4px_rgba(0,0,0,0.12)]">
  @if (showBack) {
    <button mat-icon-button (click)="back.emit()" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
  }
  <a class="inline-flex items-center gap-1.5 font-semibold text-inherit no-underline" routerLink="/dashboard" aria-label="Draftly home">
    <mat-icon>auto_awesome</mat-icon>
    <span class="[@media(max-width:480px)]:hidden">Draftly</span>
  </a>
  @if (title) {
    <span class="hide-sm ml-3 border-l border-[color-mix(in_srgb,var(--mat-sys-on-primary)_40%,transparent)] pl-3 text-[18px] font-normal">{{ title }}</span>
  }
  <ng-content />
  <span class="spacer"></span>

  @if (user$ | async; as user) {
    @if (user.googleConnected) {
      <button
        mat-button
        class="text-inherit"
        [matMenuTriggerFor]="gmailMenu"
        [attr.aria-label]="'Gmail connected' + (user.gmailEmail ? ' as ' + user.gmailEmail : '')"
        matTooltip="Gmail connection"
      >
        <mat-icon>mark_email_read</mat-icon>
        <span class="hide-sm">{{ user.gmailEmail || 'Gmail connected' }}</span>
      </button>
      <mat-menu #gmailMenu="matMenu">
        <button mat-menu-item (click)="disconnectGmail()">
          <mat-icon>link_off</mat-icon>
          <span>Disconnect Gmail</span>
        </button>
      </mat-menu>
    } @else {
      <button
      mat-stroked-button
      class="text-inherit [--mat-button-outlined-outline-color:color-mix(in_srgb,var(--mat-sys-on-primary)_70%,transparent)]"
      (click)="connectGmail()">
        <mat-icon>add_link</mat-icon>
        <span>Connect Gmail</span>
      </button>
    }

    <button mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #accountMenu="matMenu">
      <!-- Who is signed in: plain text, not a menu item (not focusable, not greyed out). -->
      <div class="mb-2 flex flex-col border-b border-outline px-4 pt-1 pb-3 leading-[1.3]">
        <span class="text-[16px] font-medium text-on-surface">{{ user.name }}</span>
        <span class="text-[12px] text-muted">{{ user.email }}</span>
      </div>
      <a mat-menu-item routerLink="/preferences">
        <mat-icon>tune</mat-icon>
        <span>Preferences</span>
      </a>
      <a mat-menu-item routerLink="/activity">
        <mat-icon>history</mat-icon>
        <span>Activity</span>
      </a>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Log out</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
