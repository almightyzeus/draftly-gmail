# Security headers for the app itself (API responses get theirs from helmet).
# Included in every location that serves the app: nginx drops inherited
# add_header directives as soon as a location sets its own (Cache-Control).
# CSP notes: Angular injects component styles and inlines the font CSS, so
# style-src needs 'unsafe-inline'; scripts stay 'self' only (the build has no
# inline scripts or handlers). Email images load from any https host after
# the user clicks "Show images".
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
