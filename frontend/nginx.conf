server {
  listen 80;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000/api/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # index.html (also served for every SPA route via try_files) must be
  # revalidated on each load, so a new release is picked up right away.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Build output with a content hash in the name (main-UYHXBL4L.js,
  # chunk-1ipd1Wg9.js, styles-UY7O6BRN.css): a new build gets new names, so
  # these can be cached for a year.
  location ~* "^/(main|polyfills|styles|chunk)-[A-Za-z0-9_-]{8}\.(js|css)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;

    try_files $uri $uri/ /index.html;
  }
}
