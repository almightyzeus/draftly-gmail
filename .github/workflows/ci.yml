name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Placeholders only: src/config/env.ts requires these at import time, and the
    # tests never call MongoDB Atlas, OpenAI or Google (in-memory MongoDB and mocks).
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/draftly-ci
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-tests
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-tests
      DATA_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      OPENAI_API_KEY: sk-ci-placeholder
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/gmail/oauth/callback
      FRONTEND_URL: http://localhost:4200
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server downloads a MongoDB binary on first use.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Typecheck tests
        run: npm run typecheck:tests
      - name: Tests with coverage thresholds
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Typecheck tests
        run: npm run typecheck:tests
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Production build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7
