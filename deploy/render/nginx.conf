# Main nginx config for the single-container demo image (deploy/render/Dockerfile).
# The server block has the same rules as frontend/nginx.conf, except:
#   - listen on the platform's $PORT (__PORT__ is replaced by start.sh);
#   - /api/ goes to the backend in this container (127.0.0.1:3000);
#   - 300 s proxy timeouts: a slow draft generation can exceed nginx's 60 s default;
#   - no access log: it would record full URLs, including Gmail search queries,
#     which the backend's own request log redacts.
# Runs as a non-root user, so the pid file and temp paths live in /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  access_log off;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen __PORT__;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://127.0.0.1:3000/api/;

      proxy_http_version 1.1;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html (also served for every SPA route via try_files) must be
    # revalidated on each load, so a new release is picked up right away.
    location = /index.html {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Build output with a content hash in the name: cached for a year.
    location ~* "^/(main|polyfills|styles|chunk)-[A-Za-z0-9_-]{8}\.(js|css)$" {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      include /etc/nginx/snippets/security-headers.conf;

      try_files $uri $uri/ /index.html;
    }
  }
}
