services:

  mongodb:
    image: mongo:7
    container_name: draftly-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: draftly-backend
    restart: unless-stopped
    ports:
      # Loopback only: the browser on this machine needs it for the Google OAuth
      # callback (GOOGLE_REDIRECT_URI), but other hosts must go through nginx so
      # they cannot spoof X-Forwarded-For (TRUST_PROXY below).
      - "127.0.0.1:3000:3000"
    env_file:
      - ./backend/.env.docker
    environment:
      # nginx (frontend container) is the single proxy hop in front of the API.
      TRUST_PROXY: "1"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: draftly-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo-data: